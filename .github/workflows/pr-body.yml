# Reusable: require `## Why` and `## How tested` sections in the PR body
# (per GIT_FLOW.md / PULL_REQUEST_TEMPLATE.md). The body-check logic is inlined
# here so consuming repos no longer need their own scripts/check_pr_body.sh.
# The job ALWAYS runs (so the required check always reports); release-automation
# PRs, dependabot PRs (auto-generated bodies), and the `trivial` label skip to
# green inside the step.
name: reusable-pr-body

on:
  workflow_call: {}

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR body sections
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          if [[ "$HEAD_REF" == release-please--* ]]; then
            echo "release automation PR — skipping body check."
            exit 0
          fi
          if [[ "$HEAD_REF" == dependabot/* ]]; then
            echo "dependabot PR — auto-generated body; skipping section check."
            exit 0
          fi
          # Exact-match the `trivial` label (comma-delimited) so a label that merely
          # contains "trivial" (e.g. `nontrivial`) does not skip validation.
          if printf ',%s,' "$PR_LABELS" | grep -q ',trivial,'; then
            echo "trivial label present. Skipping body check."
            exit 0
          fi

          # Normalize the body before checking: drop fenced code blocks and HTML
          # comments (inline and multi-line) so a `## Why` inside a code sample or a
          # comment does not count as the section, and real prose sharing a comment's
          # closing `-->` line is not lost. Fences toggle before comment handling so
          # code content never corrupts comment state.
          stripped=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | awk '
            BEGIN { code=0; comment=0 }
            {
              line=$0
              if (!comment && line ~ /^[[:space:]]*(```|~~~)/) { code=!code; next }
              if (code) next
              if (comment) { p=index(line,"-->"); if (p==0) next; line=substr(line,p+3); comment=0 }
              while ((s=index(line,"<!--"))>0) {
                rest=substr(line,s+4); e=index(rest,"-->")
                if (e==0) { line=substr(line,1,s-1); comment=1; break }
                line=substr(line,1,s-1) substr(rest,e+3)
              }
              print line
            }')

          required_sections=("## Why" "## How tested")
          failed=false

          for section in "${required_sections[@]}"; do
            # Anchored and tolerant of trailing whitespace: only a real header line
            # matches (not a mention in prose), and `## Why ` with a stray trailing
            # space still resolves to its content.
            header_re="^${section}[[:space:]]*$"
            if ! printf '%s\n' "$stripped" | grep -qE "$header_re"; then
              echo "::error::Missing section: \`$section\`. Add it with content, or apply the \`trivial\` label."
              failed=true
              continue
            fi

            content=$(printf '%s\n' "$stripped" | sed -n "/${header_re}/,/^## /{ /^## /d; p; }" | sed '/^[[:space:]]*$/d')
            if [ -z "$content" ]; then
              echo "::error::Section \`$section\` is empty. Add content, or apply the \`trivial\` label."
              failed=true
            fi
          done

          if [ "$failed" = true ]; then
            exit 1
          fi

          echo "All required sections present with content."
