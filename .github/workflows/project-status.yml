# Reusable: drive the two project statuses that no automation ever set.
#
# The board's Status field carries seven options and only two were ever used --
# Triage, written when an item is added, and Done, written when it closes. So
# the board could say what was finished and what was untouched, and nothing
# about what was in flight.
#
# This fills the gap for the two that carry real signal:
#
#   In Progress -- a pull request that declares `Closes #N` moves N there.
#   Blocked     -- the `status/blocked` label moves the issue there, and
#                  removing it moves the issue back out.
#
# The built-in "Pull request linked to issue" workflow covers half of the first
# case and none of the second, and can only be toggled in the Projects UI, so
# it cannot be reviewed, versioned or rolled back with the rest of the repo.
name: reusable-project-status

on:
  workflow_call:
    inputs:
      project_number:
        description: "Number of the org project to write to."
        required: true
        type: string
      blocked_label:
        description: "Label that means blocked."
        required: false
        type: string
        default: "status/blocked"
    secrets:
      PROJECT_TOKEN:
        description: "Token with `project` scope. Not required: without it the job warns and passes."
        required: false

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Move the item
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PROJECT_NUMBER: ${{ inputs.project_number }}
          BLOCKED_LABEL: ${{ inputs.blocked_label }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          set -euo pipefail

          # Never fatal. A board that cannot be reached must not fail the pull
          # request or the labelling that triggered this.
          if [ -z "${GH_TOKEN}" ] || [ -z "${PROJECT_NUMBER}" ]; then
            echo "::warning::PROJECT_TOKEN or project_number is unset; the board was not touched."
            exit 0
          fi

          # One query for the project and its Status field. `gh project` is not
          # used anywhere here: it resolves whether the owner is a user or an
          # organization first, which needs `read:org` on the token, and fails
          # with `unknown owner type` without it.
          field_json="$(gh api graphql -f query='
            query($o:String!,$n:Int!){
              organization(login:$o){
                projectV2(number:$n){
                  id
                  field(name:"Status"){
                    ... on ProjectV2SingleSelectField{ id options{ id name } }
                  }
                }
              }
            }' -f o="${OWNER}" -F n="${PROJECT_NUMBER}" --jq '.data.organization.projectV2' || true)"

          PROJECT_ID="$(printf '%s' "${field_json}" | jq -r '.id // empty')"
          FIELD_ID="$(printf '%s' "${field_json}" | jq -r '.field.id // empty')"
          if [ -z "${PROJECT_ID}" ] || [ -z "${FIELD_ID}" ]; then
            echo "::warning::Could not resolve project ${PROJECT_NUMBER} or its Status field; the board was not touched."
            exit 0
          fi

          option_id() {
            printf '%s' "${field_json}" | jq -r --arg n "$1" '.field.options[] | select(.name == $n) | .id'
          }

          # addProjectV2ItemById is idempotent -- an item already on the board
          # comes back with its existing id -- so this doubles as "put it on the
          # board if it is not there", which is the common case for an issue
          # nobody has touched since it was filed.
          move() {  # $1 content node id, $2 target status name, $3 label for the log
            local oid item
            oid="$(option_id "$2")"
            if [ -z "${oid}" ]; then
              echo "::warning::The project has no '$2' status; left $3 where it was."
              return 0
            fi
            item="$(gh api graphql -f query='
              mutation($p:ID!,$c:ID!){ addProjectV2ItemById(input:{projectId:$p,contentId:$c}){ item{ id } } }' \
              -f p="${PROJECT_ID}" -f c="$1" --jq '.data.addProjectV2ItemById.item.id' || true)"
            if [ -z "${item}" ]; then
              echo "::warning::Could not put $3 on the board; status not set."
              return 0
            fi
            if gh api graphql -f query='
              mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){
                updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){ projectV2Item{ id } }
              }' -f p="${PROJECT_ID}" -f i="${item}" -f f="${FIELD_ID}" -f o="${oid}" >/dev/null; then
              echo "$3 -> $2"
            else
              echo "::warning::Could not set $3 to '$2'."
            fi
          }

          case "${EVENT_NAME}" in
            pull_request|pull_request_target)
              # Only issues the pull request actually declares it closes. A
              # mention in prose is not a claim that work has started.
              refs="$(gh api graphql -f query='
                query($o:String!,$r:String!,$n:Int!){
                  repository(owner:$o,name:$r){
                    pullRequest(number:$n){ closingIssuesReferences(first:20){ nodes{ id number } } }
                  }
                }' -f o="${OWNER}" -f r="${REPO_NAME}" -F n="${PR_NUMBER}" \
                --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[] | "\(.id) \(.number)"' || true)"
              if [ -z "${refs}" ]; then
                echo "PR #${PR_NUMBER} declares no closing issue; nothing to move."
                exit 0
              fi
              while read -r cid num; do
                [ -n "${cid}" ] || continue
                move "${cid}" "In Progress" "issue #${num}"
              done <<< "${refs}"
              ;;

            issues)
              if [ "${LABEL_NAME}" != "${BLOCKED_LABEL}" ]; then
                echo "Label '${LABEL_NAME}' is not '${BLOCKED_LABEL}'; nothing to do."
                exit 0
              fi
              cid="$(gh api graphql -f query='
                query($o:String!,$r:String!,$n:Int!){
                  repository(owner:$o,name:$r){ issue(number:$n){ id } }
                }' -f o="${OWNER}" -f r="${REPO_NAME}" -F n="${ISSUE_NUMBER}" \
                --jq '.data.repository.issue.id' || true)"
              if [ -z "${cid}" ]; then
                echo "::warning::Could not resolve issue #${ISSUE_NUMBER}; the board was not touched."
                exit 0
              fi
              if [ "${ACTION}" = "labeled" ]; then
                move "${cid}" "Blocked" "issue #${ISSUE_NUMBER}"
              else
                # Unblocked. Recomputed, not restored: Projects keeps no history
                # of the status an item held before it was blocked, so there is
                # nothing to put back. An issue with an open pull request
                # referencing it is in progress; otherwise it is back in the
                # queue.
                open_prs="$(gh api "repos/${OWNER}/${REPO_NAME}/issues/${ISSUE_NUMBER}/timeline" --paginate \
                  --jq '[.[] | select(.event == "cross-referenced") | .source.issue | select(.pull_request != null) | select(.state == "open")] | length' 2>/dev/null \
                  | awk '{s += $1} END {print s + 0}')"
                if [ "${open_prs}" -gt 0 ]; then
                  move "${cid}" "In Progress" "issue #${ISSUE_NUMBER}"
                else
                  move "${cid}" "Triage" "issue #${ISSUE_NUMBER}"
                fi
              fi
              ;;

            *)
              echo "Event '${EVENT_NAME}' is not one this workflow acts on."
              ;;
          esac
