# Reusable: everything this org writes to the project board, in one place.
#
# It replaces two things that used to be separate and, in project-add's case,
# copied into five repositories where the copies had already drifted:
#
#   project-add.yml     a local copy per repo, wrapping actions/add-to-project
#   project-status.yml  a thin caller onto a reusable
#
# They are one job here because they are one operation. Putting an item on the
# board and setting its status are the same two GraphQL calls with the second
# one optional, so splitting them bought two workflow files, two token mints
# and two chances to drift.
#
# What it does, by event:
#
#   issues opened/reopened          put the issue on the board
#   pull_request* opened/reopened/  put the pull request on the board, and move
#     ready_for_review                every issue it declares it closes to
#                                     In Progress
#   issues labeled/unlabeled        the blocked label moves the issue to
#     (blocked_label)                 Blocked, and removing it moves the issue
#                                     back out
#
# Triage and Done are deliberately NOT here. The built-in Projects workflows
# (Item added, Item closed, Pull request merged) already set them, reliably and
# for free, and reimplementing them would only add a way for a missed webhook
# to strand an item. Where each transition comes from is documented in the docs
# repo, which is the part that was actually missing.
name: reusable-project-board

on:
  workflow_call:
    inputs:
      project_number:
        description: "Number of the org project to write to."
        required: true
        type: string
      blocked_label:
        description: "Label that means blocked."
        required: false
        type: string
        default: "status/blocked"
      app_client_id:
        description: >-
          Client id of the App used to mint a token. Not a secret: GitHub
          returns it from the unauthenticated /apps/{slug} endpoint. Defaults to
          mcp-hangar-release-bot.
        required: false
        type: string
        default: "Iv23li8REbSH4JUkiLb7"
    secrets:
      APP_PRIVATE_KEY:
        description: "Private key for app_client_id. The App needs Organization > Projects: Read & write, granted on the installation and not only on the App."
        required: false
      PROJECT_TOKEN:
        description: "Escape hatch: a token with project scope, used instead of minting one. Without either, the job warns and passes."
        required: false

permissions:
  contents: read

jobs:
  board:
    runs-on: ubuntu-latest
    # Secrets are not available in a step-level `if`, so they are mapped here
    # and tested through env.
    env:
      HAS_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      HAS_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    steps:
      # Minted in this job, not by the caller: the action revokes the token in
      # its own post step, so it cannot be handed to another job, and a job
      # output would not carry the value because it is masked.
      #
      # client-id rather than app-id: app-id is deprecated and warns on every
      # run.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: ${{ env.HAS_TOKEN == '' && env.HAS_KEY != '' }}
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Write to the board
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN || steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PROJECT_NUMBER: ${{ inputs.project_number }}
          BLOCKED_LABEL: ${{ inputs.blocked_label }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          set -euo pipefail

          # Never fatal. A board that cannot be reached must not fail the pull
          # request, the issue or the labelling that triggered this. Breakage is
          # surfaced by project-board-health.yml beside this, on a schedule,
          # rather than by red-checking somebody's pull request -- an API rate
          # limit did exactly that to five pull requests at once on 2026-09-09.
          if [ -z "${GH_TOKEN}" ] || [ -z "${PROJECT_NUMBER}" ]; then
            echo "::warning::No project token (neither PROJECT_TOKEN nor an App key to mint one) or no project_number; the board was not touched."
            exit 0
          fi

          # `gh project` is not used anywhere here. It resolves whether the
          # owner is a user or an organization before doing anything, which
          # needs read:org on the token, and fails with `unknown owner type`
          # without it.
          project_json="$(gh api graphql -f query='
            query($o:String!,$n:Int!){
              organization(login:$o){
                projectV2(number:$n){
                  id
                  field(name:"Status"){
                    ... on ProjectV2SingleSelectField{ id options{ id name } }
                  }
                }
              }
            }' -f o="${OWNER}" -F n="${PROJECT_NUMBER}" --jq '.data.organization.projectV2' || true)"

          PROJECT_ID="$(printf '%s' "${project_json}" | jq -r '.id // empty')"
          FIELD_ID="$(printf '%s' "${project_json}" | jq -r '.field.id // empty')"
          if [ -z "${PROJECT_ID}" ] || [ -z "${FIELD_ID}" ]; then
            echo "::warning::Could not resolve project ${PROJECT_NUMBER} or its Status field; the board was not touched."
            exit 0
          fi

          node_id() {  # $1 issue|pullRequest, $2 number
            gh api graphql -f query="
              query(\$o:String!,\$r:String!,\$n:Int!){
                repository(owner:\$o,name:\$r){ $1(number:\$n){ id } }
              }" -f o="${OWNER}" -f r="${REPO_NAME}" -F n="$2" \
              --jq ".data.repository.$1.id" 2>/dev/null || true
          }

          # Idempotent: an item already on the board comes back with its
          # existing id, so this doubles as "add it if it is not there".
          ensure() {  # $1 content node id -> prints item id
            gh api graphql -f query='
              mutation($p:ID!,$c:ID!){ addProjectV2ItemById(input:{projectId:$p,contentId:$c}){ item{ id } } }' \
              -f p="${PROJECT_ID}" -f c="$1" --jq '.data.addProjectV2ItemById.item.id' 2>/dev/null || true
          }

          add() {  # $1 content node id, $2 label for the log
            local item
            item="$(ensure "$1")"
            if [ -z "${item}" ]; then
              echo "::warning::Could not put $2 on the board."
              return 0
            fi
            echo "$2 is on the board"
          }

          move() {  # $1 content node id, $2 status name, $3 label for the log
            local oid item
            oid="$(printf '%s' "${project_json}" | jq -r --arg n "$2" '.field.options[] | select(.name == $n) | .id')"
            if [ -z "${oid}" ]; then
              echo "::warning::The project has no '$2' status; left $3 where it was."
              return 0
            fi
            item="$(ensure "$1")"
            if [ -z "${item}" ]; then
              echo "::warning::Could not put $3 on the board; status not set."
              return 0
            fi
            if gh api graphql -f query='
              mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){
                updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){ projectV2Item{ id } }
              }' -f p="${PROJECT_ID}" -f i="${item}" -f f="${FIELD_ID}" -f o="${oid}" >/dev/null 2>&1; then
              echo "$3 -> $2"
            else
              echo "::warning::Could not set $3 to '$2'."
            fi
          }

          case "${EVENT_NAME}:${ACTION}" in
            pull_request:*|pull_request_target:*)
              cid="$(node_id pullRequest "${PR_NUMBER}")"
              if [ -n "${cid}" ]; then
                add "${cid}" "PR #${PR_NUMBER}"
              else
                echo "::warning::Could not resolve PR #${PR_NUMBER}."
              fi
              # Only issues the pull request declares it closes. A mention in
              # prose is not a claim that work has started.
              refs="$(gh api graphql -f query='
                query($o:String!,$r:String!,$n:Int!){
                  repository(owner:$o,name:$r){
                    pullRequest(number:$n){ closingIssuesReferences(first:20){ nodes{ id number } } }
                  }
                }' -f o="${OWNER}" -f r="${REPO_NAME}" -F n="${PR_NUMBER}" \
                --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[] | "\(.id) \(.number)"' 2>/dev/null || true)"
              if [ -z "${refs}" ]; then
                echo "PR #${PR_NUMBER} declares no closing issue."
                exit 0
              fi
              while read -r rcid num; do
                [ -n "${rcid}" ] || continue
                move "${rcid}" "In Progress" "issue #${num}"
              done <<< "${refs}"
              ;;

            issues:opened|issues:reopened)
              cid="$(node_id issue "${ISSUE_NUMBER}")"
              if [ -z "${cid}" ]; then
                echo "::warning::Could not resolve issue #${ISSUE_NUMBER}."
                exit 0
              fi
              add "${cid}" "issue #${ISSUE_NUMBER}"
              ;;

            issues:labeled|issues:unlabeled)
              if [ "${LABEL_NAME}" != "${BLOCKED_LABEL}" ]; then
                echo "Label '${LABEL_NAME}' is not '${BLOCKED_LABEL}'; nothing to do."
                exit 0
              fi
              cid="$(node_id issue "${ISSUE_NUMBER}")"
              if [ -z "${cid}" ]; then
                echo "::warning::Could not resolve issue #${ISSUE_NUMBER}; the board was not touched."
                exit 0
              fi
              if [ "${ACTION}" = "labeled" ]; then
                move "${cid}" "Blocked" "issue #${ISSUE_NUMBER}"
              else
                # Unblocked. Recomputed, not restored: Projects keeps no history
                # of the status an item held before it was blocked, so there is
                # nothing to put back. An issue with an open pull request
                # referencing it is in progress; otherwise it is back in the
                # queue.
                open_prs="$(gh api "repos/${OWNER}/${REPO_NAME}/issues/${ISSUE_NUMBER}/timeline" --paginate \
                  --jq '[.[] | select(.event == "cross-referenced") | .source.issue | select(.pull_request != null) | select(.state == "open")] | length' 2>/dev/null \
                  | awk '{s += $1} END {print s + 0}')"
                if [ "${open_prs}" -gt 0 ]; then
                  move "${cid}" "In Progress" "issue #${ISSUE_NUMBER}"
                else
                  move "${cid}" "Triage" "issue #${ISSUE_NUMBER}"
                fi
              fi
              ;;

            *)
              echo "Event '${EVENT_NAME}' action '${ACTION}' is not one this workflow acts on."
              ;;
          esac
